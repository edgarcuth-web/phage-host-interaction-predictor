[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phage-cocktail-predictor"
version = "0.1.0"
description = "Research infrastructure for source-defined pairwise phage-host prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "threadpoolctl>=3.1",
    "jsonschema>=4.23,<5",
]

[project.scripts]
phage-model-interface = "phage_cocktail.model_interface:main"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "pytest>=8.0",
]
reference = [
    "genophi==1.0.3",
]
cloud = [
    "boto3>=1.36,<2",
]

[tool.setuptools.package-data]
phage_cocktail = ["schemas/*.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
